# SonarQube Cloud (CI-based analysis, ci.yml's sonarqube job). Turn OFF "Automatic Analysis"
# in the project's SonarQube Cloud settings, or the two analyses conflict.
sonar.organization=zelemate
sonar.projectKey=ZeleMate_forge-lab
sonar.projectName=forge-lab
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
# The Bun workspaces and the repo scripts; recorded *-results/ output is data, not code.
sonar.sources=agents,harness,lib,mcp,scripts
sonar.tests=agents,harness,lib,mcp,scripts
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*-results/**,**/*.test.ts
sonar.javascript.lcov.reportPaths=./coverage/lcov.info
