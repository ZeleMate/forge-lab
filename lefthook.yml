# Git hooks (#30). The first gate on this repo; CI (#31) and the ruleset on
# `main` come after. See SECURITY.md.
#
# One-time setup: `brew install lefthook gitleaks actionlint zizmor`, then
# `lefthook install` at the repo root. Never skip them with `--no-verify`.

# Standard `**` globbing: `**/` also matches the repo root, and `*` stops at `/`.
glob_matcher: doublestar

pre-commit:
  parallel: true
  jobs:
    - name: gitleaks
      run: gitleaks git --pre-commit --staged --redact --no-banner

    - name: no .env files
      glob: "**/.env*"
      run: bun scripts/hooks.ts no-env {staged_files}

    - name: biome
      glob: "**/*.{ts,json,jsonc}"
      # Same flags as `bun run lint`, so warnings fail here too, not only on pre-push.
      run: bun x biome check --write --error-on-warnings --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      # Biome's fixes are added back to the commit.
      stage_fixed: true

    - name: exact pins
      glob: ["**/package.json", "bunfig.toml"]
      run: bun scripts/check-pins.ts

    - name: snapshot pin
      glob: ["snapshot.json", "harness/package.json"]
      run: bun scripts/snapshot.ts check-pin

    - name: workflows
      glob: ".github/**/*.{yml,yaml}"
      # The same two commands as CI's `workflows` job: actionlint finds the
      # workflows itself; zizmor also covers the composite actions and dependabot.yml.
      run: actionlint && zizmor --offline --no-progress .

pre-push:
  # Stop at the first failing job, so a push to main fails before the slow checks run.
  piped: true
  jobs:
    - name: no push to main, gitleaks on pushed commits
      run: bun scripts/hooks.ts pre-push
      # Git sends the refs being pushed on stdin; only this job reads them.
      use_stdin: true

    # The pre-commit checks again, over the whole tree: a commit made with
    # `--no-verify` skipped them, and they cost well under a second.
    - name: exact pins
      run: bun scripts/check-pins.ts

    - name: snapshot pin
      run: bun scripts/snapshot.ts check-pin

    - name: workflows
      run: actionlint && zizmor --offline --no-progress .
      # Both tools exit non-zero when there's nothing to check.
      skip:
        - run: test ! -d .github/workflows

    - name: lockfile matches manifests
      run: bun install --frozen-lockfile

    - name: check
      run: bun run check

    - name: test
      # Real-snapshot tests fail with "run `bun run snapshot`" if it's missing (#54).
      run: bun test
