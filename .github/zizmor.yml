# zizmor's settings (#31). Stricter than its default, which lets `actions/*`
# be pinned to a tag: here every `uses:` must name a full commit SHA, matching
# the repo's "require SHA pinning" Actions setting (#28).
rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
  # Wants GitHub's newer `$/` syntax for this repo's own actions, which
  # actionlint 1.7.12 rejects. Revisit when actionlint supports it.
  self-repository:
    disable: true
