# Bun at the repo's pinned version, then the locked dependencies (#31).
# Bump the URL and its SHA-256 together with the local Homebrew bun; Dependabot
# doesn't track this file. The digest is on the GitHub release page.
# 1.4.4 was taken at 2 days old, ahead of the 7-day release age: it fixes the
# Brotli decoder RCE (CVE-2026-111497) and drops the compromised eMudhra root
# from Bun's bundled trust store (GHSA-26q8-h657-pf84), which let a network
# attacker forge certificates for `bun install`.
name: Bun and dependencies
description: Install Bun 1.4.4 from its verified release archive, then the dependencies from bun.lock with no install scripts.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/fetch-binary
      with:
        name: bun
        url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip
        sha256: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c

    - name: Install dependencies
      shell: bash
      # --frozen-lockfile fails if bun.lock doesn't match the manifests;
      # --ignore-scripts repeats bunfig.toml's ignoreScripts.
      run: bun install --frozen-lockfile --ignore-scripts
