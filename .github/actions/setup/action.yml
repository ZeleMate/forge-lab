# Bun at the repo's pinned version, then the locked dependencies (#31).
# Bump the URL and its SHA-256 together with the local Homebrew bun; Dependabot
# doesn't track this file. The digest is on the GitHub release page.
name: Bun and dependencies
description: Install Bun 1.4.3 from its verified release archive, then the dependencies from bun.lock with no install scripts.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/fetch-binary
      with:
        name: bun
        url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.3/bun-linux-x64.zip
        sha256: 3e730528d89775f03f87f05c06787c4df4099d0a37f3f252e7b829cb23816e18

    - name: Install dependencies
      shell: bash
      # --frozen-lockfile fails if bun.lock doesn't match the manifests;
      # --ignore-scripts repeats bunfig.toml's ignoreScripts.
      run: bun install --frozen-lockfile --ignore-scripts
