# Claude security review: an AI review of each PR's diff, commented on the PR.
# Kept apart from ci.yml because it's the one workflow that reads a secret
# (ANTHROPIC_API_KEY, an Actions repo secret). Like CI it reports but can't
# block a merge on GitHub Free. See SECURITY.md.
name: Security review

on:
  pull_request:

# No token permissions by default; the job asks for what it needs.
permissions: {}

# A new push to the same PR cancels the review it replaces.
concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-security:
    name: security review (Claude)
    # Same-repo PRs only: the action isn't hardened against prompt injection from untrusted diffs.
    # Dependabot PRs can't read Actions secrets.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # comments findings on the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      # No release tags upstream, so this pins a main commit. Note it installs the latest
      # @anthropic-ai/claude-code from npm on every run; that part isn't pinned.
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # main, 2026-02-11
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-model: claude-sonnet-5-5
          # By default it reviews only a PR's first commit; a gate has to see every push.
          run-every-commit: true
      # The action reports 0 findings when the scan errors, so check the results file, not its output.
      - name: Fail on findings or an incomplete review
        run: |
          f=claudecode-results.json
          if [ ! -s "$f" ]; then echo "::error::no results file: the review didn't run"; exit 1; fi
          if jq -e '.error' "$f" >/dev/null; then echo "::error::review failed: $(jq -r '.error' "$f")"; exit 1; fi
          if jq -e '.analysis_summary.review_completed == false' "$f" >/dev/null; then
            echo "::error::review incomplete: Claude's output couldn't be parsed"; exit 1
          fi
          n=$(jq '.findings | length' "$f")
          if [ "$n" -gt 0 ]; then
            jq -r '.findings[] | "::error file=\(.file),line=\(.line // 1)::[\(.severity)] \(.description // .category)"' "$f"
            exit 1
          fi
          echo "No findings."
