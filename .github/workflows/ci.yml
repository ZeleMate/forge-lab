# CI (#31): the backstop behind the git hooks (#30). `ci-ok` sums up every job and
# is the check the `main` ruleset requires (.github/rulesets/main.json); until the
# owner applies it, treat a red run as "don't merge yet". See SECURITY.md.
#
# Hardening: no token permissions beyond reading the repo, every action pinned to
# a full commit SHA, and tools fetched from their releases with pinned SHA-256
# digests (.github/actions/) instead of third-party actions. The exceptions, from
# the repo template: the sonarqube job reads SONAR_TOKEN and runs SonarSource's scanner image.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 06:17 UTC: new advisories and secret rules land even without commits.
    - cron: "17 6 * * 1"
  workflow_dispatch:

# No token permissions by default; each job asks for read access only.
permissions: {}

# A new push to the same PR or branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The read-only form of `bun run lint`, with the same --error-on-warnings.
      - run: bun x biome ci --error-on-warnings

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run typecheck

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # search_text runs ripgrep; this is the version Homebrew has locally.
      - uses: ./.github/actions/fetch-binary
        with:
          name: rg
          url: https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-unknown-linux-musl.tar.gz
          sha256: 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c
      # The source tools' tests read the real pinned Source Snapshot (#54). It's
      # fetched read-only from TrueForge's public repo; nothing in it runs.
      # (`runner.temp` exists only at step level, so both steps name the folder.)
      - run: bun run snapshot
        env:
          SOURCE_SNAPSHOT_DIR: ${{ runner.temp }}/trueforge-src
      # No --pass-with-no-tests: a run that finds no tests is a failure. The lcov report
      # feeds the sonarqube job.
      - run: bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage
        env:
          SOURCE_SNAPSHOT_DIR: ${{ runner.temp }}/trueforge-src
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: ./coverage/lcov.info
          retention-days: 1

  deps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # HEAD and its first parent: on a PR, HEAD is the merge commit and HEAD^1
          # the base branch's tip, which the release-age check compares bun.lock with.
          fetch-depth: 2
      # Includes `bun install --frozen-lockfile --ignore-scripts`.
      - uses: ./.github/actions/setup
      - name: Exact pins and install rules
        run: bun run check:pins
      # `--frozen-lockfile` above installs whatever bun.lock names, however young.
      # Looks up only the versions this change adds, on registry.npmjs.org (no token).
      - name: Release age of versions added to bun.lock
        run: bun run check:release-age --base HEAD^1
      - name: Source Snapshot pin matches TrueForge
        run: bun scripts/snapshot.ts check-pin
      - name: Known vulnerabilities
        run: bun run audit

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history of every branch, not just the tip.
          fetch-depth: 0
      - uses: ./.github/actions/fetch-binary
        with:
          name: gitleaks
          url: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      - run: gitleaks git --redact --no-banner --exit-code 1 .

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fetch-binary
        with:
          name: actionlint
          url: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      - uses: ./.github/actions/fetch-binary
        with:
          name: zizmor
          url: https://github.com/zizmorcore/zizmor/releases/download/v1.31.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
          sha256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99
      # actionlint also runs shellcheck on `run:` scripts (preinstalled on the runner).
      - run: actionlint
      # Workflows, the composite actions and dependabot.yml; config in .github/zizmor.yml.
      - run: zizmor --offline --no-progress .

  # From the repo template: Semgrep and OSV-Scanner (Gitleaks is the `secrets` job above).
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  # From the repo template: SonarQube Cloud maintainability metrics, with the coverage from `test`.
  sonarqube:
    # Fork PRs get no secrets, so they cannot be analysed.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Secrets can't be read in `if:`, so expose only whether this one is set.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Skip without a SonarQube token
        if: env.HAS_SONAR_TOKEN != 'true'
        run: echo "::warning::SONAR_TOKEN is not set, so the analysis was skipped. See docs/SETUP.md."
      - if: env.HAS_SONAR_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: env.HAS_SONAR_TOKEN == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: ./coverage
      # SonarSource's scanner image, pinned by digest, instead of its action: a third-party action
      # off the Actions allowlist fails the whole workflow at startup, even when its step is skipped.
      - name: SonarQube Cloud analysis
        if: env.HAS_SONAR_TOKEN == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          docker run --rm -e SONAR_TOKEN -e SONAR_HOST_URL=https://sonarcloud.io \
            -v "$GITHUB_WORKSPACE:/usr/src" \
            sonarsource/sonar-scanner-cli:12.3.0.4285_8.1.0@sha256:47956b669bf486bdad919e1cbd0533223515aa0b6d1d31763e5a3754942df6d7 \
            -Dsonar.working.directory=/tmp/.scannerwork

  # The single required status check for the `main` ruleset (.github/rulesets/main.json).
  # Fails if any job failed or was cancelled; a skipped job (sonarqube on a fork PR) passes.
  ci-ok:
    if: always()
    needs: [lint, typecheck, test, deps, secrets, workflows, security, sonarqube]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case "$RESULTS" in *failure*|*cancelled*) exit 1 ;; esac
