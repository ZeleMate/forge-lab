# Dependabot version updates (#31). Security alerts and fixes are on in the
# repo settings (#28). The 7-day cooldown matches bunfig.toml's minimumReleaseAge,
# and existing exact pins stay exact (check-pins fails the PR otherwise).
# A TrueForge bump also needs `bun run snapshot:pin`; CI's deps job flags it.
version: 2
updates:
  # Copier for template-update.yml (.github/tools/uv.lock), locked apart from the app.
  - package-ecosystem: uv
    directory: /.github/tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      ci-tools:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Third-party actions wait 7 days. The central workflows are our own, so they don't.
    cooldown:
      default-days: 7
      exclude: ["ZeleMate/workflows*"]
    groups:
      # Apart from `actions`, so a red central bump doesn't block unrelated updates.
      central-workflows:
        patterns: ["ZeleMate/workflows*"]
      actions:
        patterns: ["*"]
        exclude-patterns: ["ZeleMate/workflows*"]
    ignore:
      # A major central release needs caller edits, so it arrives with a template update.
      - dependency-name: "ZeleMate/workflows*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: ci

  # Named in the `extra_ecosystems` answer: this repo's own stack, not a managed language.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      bun-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps
