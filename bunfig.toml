# One bunfig for the whole workspace. Bun reads it from the folder a command
# starts in, so run `bun install` from the repo root.

# Never load .env files implicitly in `bun run`, `bun <file>` or `bun -e`. A script
# that needs a key names its file with `--env-file` (see `apply:provider` in
# harness/package.json). `bun install` still reads .env (Bun 1.4.3), which is
# why `ignoreScripts` below matters.
env = false

[install]
# Only install versions published at least 7 days ago (research/security-review.md).
minimumReleaseAge = 604800
# Accepted exception: 0.179.2 and its first-party packages were reviewed by hand
# (provenance, tarball hash, install scripts, telemetry) before they were 7 days old.
# Temporary exception, remove after 2026-11-03: node-forge 1.4.2 (2026-10-27) and
# follow-redirects 1.16.2 (2026-10-25) fix six high advisories that reach us through
# TrueForge, and are forced by the root `overrides`. Reviewed by hand: same maintainers
# as the versions before, built from the matching git tags, no install scripts, and the
# source diffs add no network, process or eval calls. Once both are 7 days old the
# exception isn't needed, and it would otherwise let any later version of either
# package skip the 7-day wait.
minimumReleaseAgeExcludes = [
  "@truefoundry/trueforge",
  "@truefoundry/trueforge-core",
  "@truefoundry/trueforge-sdk",
  "follow-redirects",
  "node-forge",
]
exact = true
# Run no install scripts at all, ours or any dependency's. Without this, Bun runs
# scripts for packages on its built-in trust list even with no `trustedDependencies`
# (better-sqlite3's implicit `node-gyp rebuild`; it loads a prebuilt binary anyway),
# and `env = false` does not stop `bun install` passing .env values to them.
ignoreScripts = true
# The default for new workspaces since Bun 1.3.2, written out because #32 decided
# to keep it: one store in node_modules/.bun/, and each package sees only the
# dependencies it declares.
linker = "isolated"
